<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Avantra Collections Orders</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.top{position:sticky;top:0;z-index:10}
header{background:#1d4ed8;color:#fff;padding:12px 16px}
header h1{font-size:18px}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
.tools{display:flex;gap:6px;margin-top:10px}
.tools .btn{flex:1;padding:8px 6px;font-size:13px}
.search{padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
.search input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff}
.chip{white-space:nowrap;padding:6px 14px;border-radius:999px;border:1px solid #d1d5db;background:#fff;font-size:14px;cursor:pointer}
.chip.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.list{padding:12px 16px 110px}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600;font-size:15px}
.item .meta{font-size:12px;color:#6b7280;margin-top:2px}
.item .price{font-size:14px;margin-top:4px;color:#1d4ed8;font-weight:600}
.btn{border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
.add{background:#1d4ed8;color:#fff}
.ghost{background:#fff;color:#1d4ed8;border:1px solid #bfdbfe}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #d1d5db;background:#fff;font-size:18px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5e7eb;z-index:20}
.bar .btn{width:100%;background:#16a34a;color:#fff;display:flex;justify-content:space-between}
.bar .btn:disabled{background:#9ca3af}
.view{display:none}.view.on{display:block}
.card{background:#fff;border-radius:12px;padding:14px;margin:12px 16px}
label{display:block;font-size:13px;color:#4b5563;margin:10px 0 4px}
input.f,textarea.f,select.f{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;font-family:inherit}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.total{font-weight:700;font-size:17px;border-top:1px solid #e5e7eb;margin-top:6px;padding-top:10px}
.back{background:none;border:0;color:#fff;font-size:15px;cursor:pointer;margin-bottom:4px}
.empty{text-align:center;color:#6b7280;padding:24px 16px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:90%;text-align:center}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#dcfce7;color:#166534}
.tag{font-size:10px;background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:6px;margin-left:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:#6b7280;margin-top:8px}
select.f.vsel{margin-top:6px;padding:6px 8px;font-size:13px}
</style>
</head>
<body>

<div id="catalogView" class="view on">
  <div class="top">
    <header>
      <h1>Avantra Collections Orders</h1><div class="sub" id="status"></div>
      <div class="tools">
        <button class="btn" id="impBtn" style="background:#fff;color:#1d4ed8">Import Excel</button>
        <button class="btn" id="waBtn" style="background:#25d366;color:#fff">WhatsApp</button>
        <button class="btn" id="expBtn" style="background:#fff;color:#1d4ed8">Orders</button>
      </div>
    </header>
    <div class="search"><input id="q" type="search" placeholder="Search products or SKU"></div>
    <div class="search" style="padding-top:0"><select class="f" id="curVendor"></select><input class="f" id="curVendorOther" placeholder="Type vendor name" style="display:none;margin-top:8px"></div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="list">
    <button class="btn ghost" style="width:100%;margin-bottom:12px" onclick="openCustom('')">+ Item not in list (type name)</button>
    <div id="list"></div>
  </div>
  <div class="bar"><button class="btn" id="viewCart" disabled><span>View cart</span><span id="barTotal"></span></button></div>
</div>

<div id="customView" class="view">
  <header><button class="back" onclick="show('catalogView')">‹ Back</button><h1>Add item not in list</h1></header>
  <div class="card">
    <label>Product name *</label><input class="f" id="cName" placeholder="e.g. Custom steel bracket">
    <div class="two">
      <div><label>Unit</label><input class="f" id="cUnit" placeholder="each / box / kg"></div>
      <div><label>Quantity *</label><input class="f" id="cQty" type="number" inputmode="numeric" min="1" value="1"></div>
    </div>
    <label>Price per unit (₹) *</label><input class="f" id="cPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
    <div class="hint" id="cVendorHint"></div>
    <button class="btn add" style="width:100%;margin-top:16px" id="cAdd">Add to order</button>
  </div>
</div>

<div id="cartView" class="view">
  <header><button class="back" onclick="show('catalogView')">‹ Back to catalog</button><h1>Review order</h1></header>
  <div class="list" id="cartList" style="padding-bottom:12px"></div>
  <div class="card" id="summary"></div>
  <div class="card">
    <label>GST %</label>
    <input class="f" id="gst" type="number" inputmode="decimal" min="0" value="0">
    <label>Notes</label>
    <textarea class="f" id="notes" rows="2" placeholder="Delivery instructions, PO number…"></textarea>
  </div>
  <div style="padding:0 16px 30px"><button class="btn add" style="width:100%" id="submit">Submit order</button></div>
</div>

<div id="doneView" class="view">
  <header><h1>Order placed</h1></header>
  <div class="card" id="doneCard"></div>
  <div style="padding:0 16px;display:grid;gap:10px">
    <button class="btn add" style="width:100%" onclick="newOrder()">New order</button>
    <button class="btn" style="width:100%;background:#25d366;color:#fff" onclick="shareOrderText(lastId)">Share this order on WhatsApp</button>
    <button class="btn ghost" style="width:100%" onclick="shareWhatsApp(lastId)">Send this order as Excel</button>
    <button class="btn ghost" style="width:100%" onclick="openOrders()">View all saved orders</button>
  </div>
</div>

<div id="ordersView" class="view">
  <header><button class="back" onclick="show('catalogView')">‹ Back</button><h1>Saved orders</h1></header>
  <div class="list" id="ordersList" style="padding-bottom:12px"></div>
  <div style="padding:0 16px 30px;display:grid;gap:10px">
    <button class="btn" id="waBtn2" style="width:100%;background:#25d366;color:#fff">Share all orders as Excel on WhatsApp</button>
    <button class="btn" id="expBtn2" style="width:100%;background:#fff;color:#16a34a;border:1px solid #86efac">Download all as Excel</button>
    <button class="btn" id="clrBtn" style="width:100%;background:#fff;color:#b91c1c;border:1px solid #fca5a5">Clear saved orders</button>
  </div>
</div>

<input type="file" id="file" accept=".xlsx,.xls,.csv" multiple style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const INR=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'});
const money=n=>INR.format(n||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Could not save on device')}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- data (sample until an Excel file is imported) ---------- */
const SAMPLE_P=[
 {sku:'WID-100',name:'Standard Widget',cat:'Widgets',unit:'box of 50',price:3500},
 {sku:'WID-200',name:'Heavy-Duty Widget',cat:'Widgets',unit:'box of 25',price:5600},
 {sku:'FAS-010',name:'Steel Bolts M8',cat:'Fasteners',unit:'bag of 200',price:1550},
 {sku:'FAS-020',name:'Hex Nuts M8',cat:'Fasteners',unit:'bag of 200',price:1020},
 {sku:'TOL-001',name:'Torque Wrench',cat:'Tools',unit:'each',price:10500},
 {sku:'TOL-003',name:'Safety Gloves',cat:'Tools',unit:'pair',price:620},
 {sku:'PKG-100',name:'Shipping Cartons L',cat:'Packaging',unit:'pack of 20',price:2100}
];
const SAMPLE_V=['Acme Manufacturing','Brightline Supply','Cobalt Industries'];
let PRODUCTS=lsGet('products',SAMPLE_P), VENDORS=lsGet('vendors',SAMPLE_V);
const cart={};let cat='All',term='';

/* ---------- Excel import (Products + Vendors) ---------- */
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function pick(row,names){for(const k in row){if(names.includes(norm(k))&&String(row[k]).trim()!=='')return row[k]}return ''}
const toNum=v=>{const n=parseFloat(String(v).replace(/[₹,\sA-Za-z]/g,''));return isNaN(n)?0:n};
function parseSheet(name,rows){
 if(!rows.length)return null;
 const keys=Object.keys(rows[0]).map(norm), n=norm(name);
 const hasPrice=keys.some(k=>['price','rate','mrp','unitprice','priceinr','rupees','baseprice'].includes(k));
 const isVendor=n.includes('vendor')||n.includes('supplier')||(!hasPrice&&!n.includes('product')&&!n.includes('item'));
 if(isVendor){
  const v=rows.map(r=>String(pick(r,['vendor','vendorname','supplier','suppliername','name'])).trim()).filter(Boolean);
  return v.length?{vendors:[...new Set(v)]}:null}
 const p=rows.map(r=>({
  sku:String(pick(r,['sku','skuid','code','itemcode','productcode'])).trim(),
  name:String(pick(r,['product','productname','name','item','itemname','description'])).trim().replace(/^[^A-Za-z0-9]+/,''),
  kw:String(pick(r,['keywords','tags'])).trim(),
  active:!/^(no|n|false|0|inactive)$/i.test(String(pick(r,['active'])).trim()),
  cat:String(pick(r,['category','group','type'])).trim()||'General',
  unit:String(pick(r,['unit','uom','pack','packing'])).trim(),
  price:toNum(pick(r,['price','rate','mrp','unitprice','priceinr','rupees','baseprice']))
 })).filter(x=>x.name&&x.active);
 return p.length?{products:p}:null}
async function importFiles(files){
 if(!window.XLSX){toast('Excel library not loaded - connect to internet once and retry');return}
 let np=0,nv=0;
 for(const f of files){
  try{
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
   wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''});
    const r=parseSheet(sn,rows)||parseSheet(f.name,rows);
    if(!r)return;
    if(r.products){PRODUCTS=r.products;np=r.products.length}
    if(r.vendors){VENDORS=r.vendors;nv=r.vendors.length}
   })
  }catch(e){toast('Could not read '+f.name)}
 }
 if(!np&&!nv){toast('No products or vendors found. Check column names.');return}
 if(np)lsSet('products',PRODUCTS);if(nv)lsSet('vendors',VENDORS);
 cat='All';renderAll();toast(`Loaded ${np} products, ${nv} vendors`)}

/* ---------- cart ---------- */
const lines=()=>Object.values(cart);
const sub=()=>lines().reduce((s,l)=>s+l.qty*l.price,0);
const count=()=>lines().reduce((s,l)=>s+l.qty,0);
function curVendor(){const s=$('curVendor').value;return (s==='__other'?$('curVendorOther').value:s).trim()}
const pbase=p=>'c:'+(p.sku||p.name);
const pkey=(p,v)=>pbase(p)+'|'+v;
function addP(i){const p=PRODUCTS[i],v=curVendor();
 if(!v){toast('Select a vendor first');window.scrollTo(0,0);return}
 const k=pkey(p,v);
 if(!cart[k])cart[k]={key:k,base:pbase(p),vendor:v,sku:p.sku,name:p.name,unit:p.unit,price:p.price,qty:0,custom:false};
 cart[k].qty++;refresh()}
function setLineVendor(k,v){const l=cart[k];if(!l||!v||v===l.vendor)return;
 const nk=l.base+'|'+v;
 if(cart[nk])cart[nk].qty+=l.qty;else cart[nk]={...l,key:nk,vendor:v};
 delete cart[k];refresh()}
function setQty(k,d){if(!cart[k])return;cart[k].qty+=d;if(cart[k].qty<=0)delete cart[k];refresh()}
function refresh(){renderList();renderBar();if($('cartView').classList.contains('on'))renderCart()}

/* ---------- views ---------- */
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);if(id==='cartView')renderCart()}
function renderCats(){const cs=['All',...new Set(PRODUCTS.map(p=>p.cat))];$('cats').style.display=cs.length>2?'flex':'none';
 $('cats').innerHTML=cs.map(c=>`<div class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</div>`).join('');
 $('cats').querySelectorAll('.chip').forEach(e=>e.onclick=()=>{cat=e.dataset.c;renderCats();renderList()})}
function ctl(k,i){const l=cart[k];
 return l?`<div class="qty"><button onclick="setQty('${k.replace(/'/g,"\\'")}',-1)">−</button><span>${l.qty}</span><button onclick="setQty('${k.replace(/'/g,"\\'")}',1)">+</button></div>`
 :`<button class="btn add" onclick="addP(${i})">Add</button>`}
function renderList(){const t=term.toLowerCase(),cv=curVendor();
 const items=PRODUCTS.map((p,i)=>({p,i})).filter(({p})=>(cat==='All'||p.cat===cat)&&(!t||(p.name+' '+p.sku+' '+(p.kw||'')).toLowerCase().includes(t)));
 const total=items.length,shown=items.slice(0,150);
 let h=shown.map(({p,i})=>`<div class="item"><div class="info"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.sku)}${p.sku&&p.unit?' · ':''}${esc(p.unit)}</div><div class="price">${money(p.price)}</div></div>${ctl(pkey(p,cv),i)}</div>`).join('');
 if(total>150)h+=`<div class="empty">Showing first 150 of ${total}. Type in search to narrow.</div>`;
 if(!items.length)h=`<div class="empty">No matching product${term?` for “${esc(term)}”`:''}</div>`;
 if(term&&!items.length)h+=`<button class="btn add" style="width:100%" onclick="openCustom(term)">Add “${esc(term)}” as custom item</button>`;
 $('list').innerHTML=h}
function renderBar(){const c=count();$('viewCart').disabled=!c;
 $('viewCart').firstElementChild.textContent=c?`View cart (${c})`:'View cart';$('barTotal').textContent=c?money(sub()):''}
function gstPct(){return Math.max(0,parseFloat($('gst').value)||0)}
function renderCart(){
 if(!lines().length){show('catalogView');return}
 const vopts=l=>{const vs=VENDORS.includes(l.vendor)?VENDORS:[l.vendor,...VENDORS];return vs.map(v=>`<option${v===l.vendor?' selected':''}>${esc(v)}</option>`).join('')};
 $('cartList').innerHTML=lines().sort((a,b)=>a.vendor.localeCompare(b.vendor)).map(l=>{const ek=l.key.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');return `<div class="item" style="align-items:flex-start"><div class="info"><div class="name">${esc(l.name)}${l.custom?'<span class="tag">custom</span>':''}</div><div class="meta">${money(l.price)} × ${l.qty} = ${money(l.price*l.qty)}</div><select class="f vsel" onchange="setLineVendor('${ek}',this.value)">${vopts(l)}</select></div><div class="qty"><button onclick="setQty('${ek}',-1)">−</button><span>${l.qty}</span><button onclick="setQty('${ek}',1)">+</button></div></div>`}).join('');
 const s=sub(),g=s*gstPct()/100;
 $('summary').innerHTML=`<div class="row"><span>Subtotal</span><span>${money(s)}</span></div><div class="row"><span>GST (${gstPct()}%)</span><span>${money(g)}</span></div><div class="row total"><span>Total</span><span>${money(s+g)}</span></div>`}
function renderVendors(){
 const prev=$('curVendor').value;
 $('curVendor').innerHTML='<option value="">Select vendor for items you add…</option>'+VENDORS.map(v=>`<option>${esc(v)}</option>`).join('')+'<option value="__other">Other (type name)…</option>';
 if([...$('curVendor').options].some(o=>o.value===prev))$('curVendor').value=prev;
 $('curVendorOther').style.display=$('curVendor').value==='__other'?'block':'none'}
function renderStatus(){$('status').textContent=`${PRODUCTS.length} products · ${VENDORS.length} vendors`}
function renderAll(){renderStatus();renderCats();renderList();renderBar();renderVendors()}

/* ---------- custom item ---------- */
function openCustom(n){$('cName').value=n||'';$('cUnit').value='';$('cQty').value=1;$('cPrice').value='';$('cVendorHint').textContent=curVendor()?'Vendor: '+curVendor():'No vendor selected - go back and choose one';show('customView')}
$('cAdd').onclick=()=>{
 const name=$('cName').value.trim(),qty=parseInt($('cQty').value)||0,price=parseFloat($('cPrice').value);
 if(!name){toast('Enter product name');return}
 if(qty<1){toast('Enter quantity');return}
 if(isNaN(price)||price<0){toast('Enter price in ₹');return}
 const v=curVendor();if(!v){toast('Select a vendor first');return}
 const base='x:'+Date.now(),k=base+'|'+v;
 cart[k]={key:k,base,vendor:v,sku:'',name,unit:$('cUnit').value.trim(),price,qty,custom:true};
 term='';$('q').value='';refresh();toast('Added '+name);show('catalogView')};

/* ---------- submit & storage ---------- */
function loadOrders(){return lsGet('orders',[])}
function updateExportBtn(){const n=loadOrders().length;$('expBtn').textContent=n?`Orders (${n})`:'Orders'}
$('submit').onclick=()=>{
 if(!count())return;
 const vendors=[...new Set(lines().map(l=>l.vendor))];
 const s=sub(),pct=gstPct(),g=s*pct/100,id='ORD-'+Date.now().toString().slice(-6);
 const order={id,vendors,notes:$('notes').value,lines:lines().sort((a,b)=>a.vendor.localeCompare(b.vendor)).map(l=>({...l})),subtotal:s,gstPct:pct,gst:g,total:s+g,date:new Date().toISOString()};
 const all=loadOrders();all.push(order);lsSet('orders',all);
 $('doneCard').innerHTML=`<div class="row"><b>${id}</b><span class="badge">Saved</span></div><div class="row"><span>${vendors.length} vendor${vendors.length>1?'s':''}</span><span>${count()} items</span></div><div class="row total"><span>Total</span><span>${money(order.total)}</span></div>`;
 lastId=id;updateExportBtn();show('doneView')};
function newOrder(){for(const k in cart)delete cart[k];$('notes').value='';refresh();show('catalogView')}

/* ---------- Excel export / WhatsApp ---------- */
function buildFile(only){
 const orders=loadOrders().filter(o=>Array.isArray(o.lines)&&(!only||o.id===only));if(!orders.length){toast('No orders yet');return null}
 const L=[],S=[],d=o=>o.date.slice(0,19).replace('T',' ');
 orders.forEach(o=>{
  S.push({'Order ID':o.id,'Date':d(o),'Vendors':(o.vendors||[o.vendor]).join(', '),'Subtotal (₹)':+o.subtotal.toFixed(2),'GST %':o.gstPct,'GST (₹)':+o.gst.toFixed(2),'Total (₹)':+o.total.toFixed(2),'Notes':o.notes});
  o.lines.forEach(l=>L.push({'Order ID':o.id,'Date':d(o),'Vendor':l.vendor||o.vendor,'SKU':l.sku,'Product':l.name,'Source':l.custom?'Custom':'Catalog','Unit':l.unit,'Qty':l.qty,'Rate (₹)':l.price,'Line Total (₹)':+(l.qty*l.price).toFixed(2),'Notes':o.notes}))});
 const name=only||('orders-'+new Date().toISOString().slice(0,10));
 if(window.XLSX){const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S),'Orders');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L),'Line Items');
  const T='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  return {name:name+'.xlsx',type:T,blob:new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:T}),n:orders.length}}
 const h=Object.keys(L[0]),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const csv='\ufeff'+[h.map(q).join(','),...L.map(r=>h.map(k=>q(r[k])).join(','))].join('\n');
 return {name:name+'.csv',type:'text/csv',blob:new Blob([csv],{type:'text/csv'}),n:orders.length}}
function download(f){const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;a.click()}
function exportExcel(){const f=buildFile();if(!f)return;download(f);toast('Excel file downloaded')}
async function shareWhatsApp(only){
 const f=buildFile(only);if(!f)return;
 const file=new File([f.blob],f.name,{type:f.type}),text=only?`Order ${only}`:`Orders (${f.n}) - ${new Date().toLocaleDateString()}`;
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],text,title:'Orders'});return}catch(e){if(e.name==='AbortError')return}}
 download(f);toast('File downloaded - attach it in WhatsApp');
 setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank'),800)}
let lastId='';
function openOrders(){renderOrders();show('ordersView')}
function renderOrders(){
 const os=loadOrders().filter(o=>Array.isArray(o.lines)).reverse();
 $('ordersList').innerHTML=os.length?os.map(o=>`<div class="card" style="margin:0 0 10px"><div class="row"><b>${esc(o.id)}</b><span class="badge">${money(o.total)}</span></div><div class="meta" style="font-size:12px;color:#6b7280">${esc(new Date(o.date).toLocaleString())} · ${o.lines.reduce((s,l)=>s+l.qty,0)} items · ${esc((o.vendors||[o.vendor]).join(', '))}</div><div class="two" style="margin-top:10px"><button class="btn" style="background:#25d366;color:#fff" onclick="shareOrderText('${o.id}')">WhatsApp</button><button class="btn ghost" onclick="shareWhatsApp('${o.id}')">Excel file</button></div></div>`).join(''):'<div class="empty">No saved orders yet</div>'}
function orderText(o){
 const by={};o.lines.forEach(l=>{const v=l.vendor||o.vendor||'Vendor';(by[v]=by[v]||[]).push(l)});
 let t=`*Order ${o.id}*\n${new Date(o.date).toLocaleString()}\n`;
 Object.keys(by).forEach(v=>{const ls=by[v];t+=`\n*${v}*\n`+ls.map(l=>`• ${l.name}${l.sku?' ('+l.sku+')':''} - ${l.qty} × ${money(l.price)} = ${money(l.qty*l.price)}`).join('\n')+`\nVendor total: ${money(ls.reduce((s,l)=>s+l.qty*l.price,0))}\n`});
 t+=`\nSubtotal: ${money(o.subtotal)}\nGST (${o.gstPct}%): ${money(o.gst)}\n*Total: ${money(o.total)}*`;
 if(o.notes)t+=`\n\nNotes: ${o.notes}`;
 return t}
function shareOrderText(id){const o=loadOrders().find(x=>x.id===id);if(!o){toast('Order not found');return}
 window.open('https://wa.me/?text='+encodeURIComponent(orderText(o)),'_blank')}
function clearOrders(){if(confirm('Delete all saved orders from this device? Export first.')){lsSet('orders',[]);updateExportBtn();renderOrders();toast('Cleared')}}

/* ---------- wire up ---------- */
$('q').oninput=e=>{term=e.target.value;renderList()};
$('viewCart').onclick=()=>show('cartView');
$('curVendor').onchange=()=>{$('curVendorOther').style.display=$('curVendor').value==='__other'?'block':'none';renderList()};
$('curVendorOther').oninput=renderList;
$('gst').oninput=renderCart;
$('impBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
$('expBtn').onclick=openOrders;$('expBtn2').onclick=exportExcel;
$('waBtn').onclick=()=>shareWhatsApp();$('waBtn2').onclick=()=>shareWhatsApp();
$('clrBtn').onclick=clearOrders;
renderAll();updateExportBtn();
</script>
</body>
</html>
